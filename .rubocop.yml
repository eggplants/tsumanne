plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    # Generated by `tapioca gem`; linting them only creates churn on regeneration.
    - 'sorbet/rbi/gems/**/*.rbi'
    # Bundler binstub.
    - 'bin/tapioca'

# This gem keeps its development dependencies in the gemspec, not the Gemfile.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 15

Gemspec:
  Enabled: true

# `CLI` is a flat dispatcher: one short method per subcommand, which reads best in a single class.
Metrics/ClassLength:
  Exclude:
    - 'lib/tsumanne/cli.rb'
