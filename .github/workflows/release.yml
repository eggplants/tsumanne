name: Release Gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: rubygems

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
    - run: mise run install
    - run: mise run lint
    - run: mise run test
    - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
    - id: create_release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

  ghcr:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  binary:
    needs: release
    name: binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-gnu-x86_64
          format: limnifs
        - os: ubuntu-24.04-arm
          platform: linux-gnu-arm64
          format: limnifs
        - os: macos-latest
          platform: macos-arm64
          format: limnifs
        - os: macos-15-intel
          platform: macos-x86_64
          format: limnifs
        - os: windows-latest
          platform: windows-x86_64
          suffix: .exe
          format: dwarfs

    env:
      TEBAKO_VERSION: v0.2.5
      TEBAKO_RUBY: 4.0.6

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ env.TEBAKO_RUBY }}

    - name: Install tebako
      if: runner.os != 'Windows'
      run: |
        curl -fsSL https://tebako.org/install.sh | sh -s -- "$TEBAKO_VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install tebako (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        base="https://github.com/tamatebako/tebako/releases/download/${TEBAKO_VERSION}"
        mkdir -p "$HOME/.local/bin"
        for binary in tebako tebako-bootstrap; do
          curl -fsSL -o "$HOME/.local/bin/${binary}.exe" \
            "${base}/${binary}-${TEBAKO_VERSION#v}-windows-ucrt64.exe"
        done
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Stage the application root
      shell: bash
      run: |
        mkdir -p stage dist
        cp -R lib exe stage/
        ruby -e '
          spec = Gem::Specification.load("tsumanne.gemspec")
          gems = spec.runtime_dependencies.map do |dep|
            "gem #{dep.name.inspect}, #{dep.requirement.as_list.map(&:inspect).join(", ")}"
          end
          File.write("stage/Gemfile", ["source #{"https://rubygems.org".inspect}", *gems, ""].join("\n"))
        '
        cat stage/Gemfile

    - name: Press the executable
      shell: bash
      run: |
        tebako press \
          --root=stage \
          --entry-point=exe/tsumanne \
          --Ruby="$TEBAKO_RUBY" \
          --mode=fat \
          --format="${{ matrix.format }}" \
          --output="dist/tsumanne-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"

    - name: Smoke-test the executable
      shell: bash
      run: |
        binary="dist/tsumanne-${GITHUB_REF_NAME#v}-${{ matrix.platform }}${{ matrix.suffix }}"
        chmod +x "$binary"
        "./$binary" --version

    - name: Attach the executable to the release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
